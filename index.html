<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>معاينة وتحرير PDF — Preview PDF</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E📄%3C/text%3E%3C/svg%3E">
<style>
@font-face{
  font-family:'Amiri';
  src:url('https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/amiri/Amiri-Regular.ttf') format('truetype');
  font-weight:400;font-style:normal;font-display:swap;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--surface:#fff;--surface-2:#f1f5f9;--text:#0f172a;--text-muted:#64748b;
  --primary:#3b82f6;--primary-hover:#2563eb;--border:#e2e8f0;--success:#10b981;
  --danger:#ef4444;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
  --radius:10px;
}
[data-theme="dark"]{
  --bg:#0f172a;--surface:#1e293b;--surface-2:#334155;--text:#f1f5f9;--text-muted:#94a3b8;
  --border:#334155;--shadow:0 1px 3px rgba(0,0,0,.3);
}
html,body{height:100%}
body{
  font-family:'Segoe UI',Tahoma,'Noto Naskh Arabic','Amiri',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  transition:background .2s,color .2s;
}
.app{display:flex;flex-direction:column;min-height:100vh}
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10;box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:17px;font-weight:700}
.brand .badge{font-size:11px;background:var(--primary);color:#fff;padding:2px 8px;border-radius:20px;font-weight:600}
.icon-btn{
  width:38px;height:38px;border:1px solid var(--border);background:var(--surface);
  color:var(--text);border-radius:8px;cursor:pointer;font-size:16px;
  display:inline-flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.icon-btn:hover:not(:disabled){background:var(--surface-2);border-color:var(--primary)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.btn{
  padding:8px 16px;border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;
  transition:all .15s;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover)}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-success:hover:not(:disabled){filter:brightness(.92)}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 12px;font-size:12px}
.main{flex:1;display:flex;flex-direction:column}

/* Drop Zone */
.drop-zone{
  flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;
}
.drop-inner{
  width:100%;max-width:520px;text-align:center;padding:60px 30px;
  border:2px dashed var(--border);border-radius:20px;background:var(--surface);
  transition:all .2s;
}
.drop-zone.dragover .drop-inner{
  border-color:var(--primary);background:rgba(59,130,246,.06);transform:scale(1.01);
}
.drop-inner h2{font-size:20px;margin-bottom:8px;font-weight:700}
.drop-inner p{color:var(--text-muted);margin:10px 0;font-size:14px}
.drop-inner .upload-icon{width:64px;height:64px;margin:0 auto 20px;color:var(--primary);display:block}
.drop-inner .hint{font-size:12px;color:var(--text-muted);margin-top:16px}

/* Workspace */
.workspace{flex:1;display:flex;flex-direction:column;background:var(--bg)}
.toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);
  flex-wrap:wrap;position:sticky;top:63px;z-index:9;
}
.toolbar-group{display:flex;align-items:center;gap:6px}
.page-info{font-size:13px;color:var(--text-muted);min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
.viewer{
  flex:1;overflow:auto;padding:24px;display:flex;justify-content:center;align-items:flex-start;
  background:var(--bg);
}
.page-container{
  position:relative;display:inline-block;box-shadow:0 4px 20px rgba(0,0,0,.12);
  border-radius:4px;overflow:visible;background:#fff;
}
#pdfCanvas{display:block;border-radius:4px}
.overlay{position:absolute;inset:0;pointer-events:auto}

/* Text boxes */
.text-box{
  position:absolute;background:rgba(255,255,255,.85);border:1.5px dashed transparent;
  border-radius:4px;padding:4px 8px;cursor:text;transition:border-color .15s,box-shadow .15s,background .15s;
  direction:rtl;
}
.text-box:hover{border-color:var(--primary)}
.text-box:focus-within{
  border-color:var(--primary);background:rgba(255,255,255,.96);
  box-shadow:0 0 0 3px rgba(59,130,246,.15);
}
.tb-content{
  outline:none;min-height:1.2em;white-space:pre-wrap;word-wrap:break-word;
  font-family:inherit;line-height:1.4;
}
.tb-handle{
  position:absolute;top:-11px;right:-11px;width:22px;height:22px;
  background:var(--primary);color:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:12px;
  cursor:grab;opacity:0;transition:opacity .15s;user-select:none;
}
.tb-handle:active{cursor:grabbing}
.tb-delete{
  position:absolute;top:-11px;left:-11px;width:22px;height:22px;
  background:var(--danger);color:#fff;border:none;border-radius:50%;
  font-size:11px;cursor:pointer;opacity:0;transition:opacity .15s;
  display:flex;align-items:center;justify-content:center;
}
.text-box:hover .tb-handle,.text-box:focus-within .tb-handle,
.text-box:hover .tb-delete,.text-box:focus-within .tb-delete{opacity:1}

/* Toasts */
.toast-container{
  position:fixed;bottom:20px;left:20px;display:flex;flex-direction:column;gap:8px;z-index:100;
}
.toast{
  padding:12px 18px;background:var(--surface);color:var(--text);border-radius:8px;
  box-shadow:0 4px 20px rgba(0,0,0,.2);font-size:13px;font-weight:500;
  border-right:4px solid var(--primary);animation:slideIn .25s ease;
  max-width:340px;
}
.toast-success{border-right-color:var(--success)}
.toast-error{border-right-color:var(--danger)}
@keyframes slideIn{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}

@media (max-width:640px){
  .brand h1{font-size:15px}
  .toolbar{padding:8px 10px}
  .btn-sm{padding:5px 10px;font-size:11px}
  .page-info{min-width:50px;font-size:12px}
  .viewer{padding:12px}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <h1>📄 معاينة وتحرير PDF</h1>
      <span class="badge">v2.0</span>
    </div>
    <button id="themeToggle" class="icon-btn" title="تبديل المظهر">🌙</button>
  </header>

  <main class="main">
    <section id="dropZone" class="drop-zone">
      <div class="drop-inner">
        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <h2>اسحب ملف PDF هنا</h2>
        <p>أو</p>
        <button class="btn btn-primary" id="browseBtn">اختر ملفاً من جهازك</button>
        <p class="hint">الحجم الأقصى: 50 ميجابايت</p>
      </div>
      <input type="file" id="fileInput" accept="application/pdf" hidden>
    </section>

    <section id="workspace" class="workspace" hidden>
      <div class="toolbar">
        <div class="toolbar-group">
          <button id="prevPage" class="icon-btn" title="الصفحة السابقة">›</button>
          <span id="pageInfo" class="page-info">1 / 1</span>
          <button id="nextPage" class="icon-btn" title="الصفحة التالية">‹</button>
        </div>
        <div class="toolbar-group">
          <button id="zoomOut" class="icon-btn" title="تصغير">−</button>
          <span id="zoomInfo" class="page-info">100%</span>
          <button id="zoomIn" class="icon-btn" title="تكبير">+</button>
          <button id="fitWidth" class="btn btn-sm" title="ملء العرض">↔</button>
        </div>
        <div class="toolbar-group">
          <button id="addText" class="btn btn-sm btn-primary">+ نص</button>
          <button id="exportBtn" class="btn btn-sm btn-success">⤓ تصدير</button>
          <button id="resetBtn" class="btn btn-sm btn-ghost" title="إغلاق">✕</button>
        </div>
      </div>
      <div class="viewer" id="viewer">
        <div class="page-container" id="pageContainer">
          <canvas id="pdfCanvas"></canvas>
          <div class="overlay" id="overlay"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast-container" id="toastContainer"></div>
</div>

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.8.69/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.8.69/build/pdf.worker.min.mjs';

// ============ State ============
const state = {
  pdfDoc: null, numPages: 0, currentPage: 1, scale: 1,
  pages: {}, fileName: '', originalBytes: null,
};

const $ = id => document.getElementById(id);
const dropZone = $('dropZone'), workspace = $('workspace'), fileInput = $('fileInput');
const browseBtn = $('browseBtn'), viewer = $('viewer'), pdfCanvas = $('pdfCanvas');
const overlay = $('overlay'), pageContainer = $('pageContainer');
const pageInfo = $('pageInfo'), zoomInfo = $('zoomInfo');
const prevPageBtn = $('prevPage'), nextPageBtn = $('nextPage');
const zoomInBtn = $('zoomIn'), zoomOutBtn = $('zoomOut'), fitWidthBtn = $('fitWidth');
const addTextBtn = $('addText'), exportBtn = $('exportBtn'), resetBtn = $('resetBtn');
const themeToggle = $('themeToggle'), toastContainer = $('toastContainer');

// ============ Utils ============
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  toastContainer.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 3500);
  setTimeout(() => el.remove(), 3900);
}
function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// ============ Theme ============
const savedTheme = localStorage.getItem('theme');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
themeToggle.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('theme', next);
  themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
});
if (savedTheme === 'dark') themeToggle.textContent = '☀️';

// ============ Load PDF ============
async function loadPDF(file) {
  if (!file || (!file.type.includes('pdf') && !file.name.toLowerCase().endsWith('.pdf'))) {
    return toast('يرجى اختيار ملف PDF صالح', 'error');
  }
  if (file.size > 50 * 1024 * 1024) {
    return toast('الحجم يتجاوز 50 ميجابايت', 'error');
  }
  try {
    toast('جارٍ فتح الملف...', 'info');
    const buf = await file.arrayBuffer();
    state.originalBytes = new Uint8Array(buf.slice(0));
    const task = pdfjsLib.getDocument({ data: buf });
    state.pdfDoc = await task.promise;
    state.numPages = state.pdfDoc.numPages;
    state.currentPage = 1;
    state.pages = {};
    state.fileName = file.name;
    dropZone.hidden = true;
    workspace.hidden = false;
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    await fitWidth();
    toast(`تم فتح الملف (${state.numPages} صفحة)`, 'success');
  } catch (err) {
    console.error(err);
    let msg = 'فشل فتح الملف';
    if (err.name === 'PasswordException') msg = 'الملف محمي بكلمة مرور';
    else if (err.name === 'InvalidPDFException') msg = 'الملف تالف أو غير صالح';
    toast(msg, 'error');
  }
}

// ============ Rendering ============
async function renderCurrentPage() {
  if (!state.pdfDoc) return;
  const page = await state.pdfDoc.getPage(state.currentPage);
  const viewport = page.getViewport({ scale: state.scale });
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  pdfCanvas.width = Math.floor(viewport.width * dpr);
  pdfCanvas.height = Math.floor(viewport.height * dpr);
  pdfCanvas.style.width = viewport.width + 'px';
  pdfCanvas.style.height = viewport.height + 'px';

  const ctx = pdfCanvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  await page.render({ canvasContext: ctx, viewport }).promise;

  overlay.style.width = viewport.width + 'px';
  overlay.style.height = viewport.height + 'px';

  pageInfo.textContent = `${state.currentPage} / ${state.numPages}`;
  zoomInfo.textContent = Math.round(state.scale * 100) + '%';
  prevPageBtn.disabled = state.currentPage <= 1;
  nextPageBtn.disabled = state.currentPage >= state.numPages;

  renderTextBoxes();
}

async function fitWidth() {
  if (!state.pdfDoc) return;
  const page = await state.pdfDoc.getPage(state.currentPage);
  const vp = page.getViewport({ scale: 1 });
  const avail = viewer.clientWidth - 48;
  state.scale = Math.min(3, Math.max(0.3, avail / vp.width));
  await renderCurrentPage();
}

// ============ Text Boxes ============
function getBoxes(p) { return (state.pages[p] ||= { textBoxes: [] }).textBoxes; }
function currentBoxes() { return getBoxes(state.currentPage); }

function renderTextBoxes() {
  overlay.innerHTML = '';
  for (const box of currentBoxes()) overlay.appendChild(buildBoxEl(box));
}

function buildBoxEl(box) {
  const s = state.scale;
  const el = document.createElement('div');
  el.className = 'text-box';
  el.dataset.id = box.id;
  Object.assign(el.style, {
    left: (box.x * s) + 'px', top: (box.y * s) + 'px',
    width: (box.w * s) + 'px', minHeight: (box.h * s) + 'px',
    fontSize: (box.fontSize * s) + 'px', color: box.color,
  });

  const handle = document.createElement('div');
  handle.className = 'tb-handle';
  handle.textContent = '⠿';
  handle.title = 'نقل';

  const del = document.createElement('button');
  del.className = 'tb-delete';
  del.textContent = '✕';
  del.title = 'حذف';

  const content = document.createElement('div');
  content.className = 'tb-content';
  content.contentEditable = 'true';
  content.spellcheck = false;
  content.dir = 'auto';
  content.textContent = box.text;

  content.addEventListener('input', () => {
    box.text = content.innerText;
    autoGrow(el, content, box);
  });
  content.addEventListener('blur', () => {
    if (!content.innerText.trim()) {
      const idx = currentBoxes().findIndex(b => b.id === box.id);
      if (idx > -1) currentBoxes().splice(idx, 1);
      el.remove();
    }
  });
  del.addEventListener('click', e => {
    e.stopPropagation();
    const idx = currentBoxes().findIndex(b => b.id === box.id);
    if (idx > -1) currentBoxes().splice(idx, 1);
    el.remove();
  });

  el.append(handle, content, del);
  makeDraggable(el, handle, box);
  return el;
}

function autoGrow(el, content, box) {
  const s = state.scale;
  const baseH = content.scrollHeight / s;
  box.h = Math.max(box.fontSize * 1.4, baseH);
  el.style.minHeight = (box.h * s) + 'px';
}

function addTextBox() {
  if (!state.pdfDoc) return;
  const s = state.scale;
  const w = 220, h = 40, fontSize = 16;
  const cx = (overlay.clientWidth / 2) / s;
  const cy = (overlay.clientHeight / 2) / s;
  const box = {
    id: 'tb_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    x: cx - w / 2, y: cy - h / 2, w, h,
    text: 'اكتب هنا...', fontSize, color: '#111827',
  };
  currentBoxes().push(box);
  renderTextBoxes();
  requestAnimationFrame(() => {
    const target = overlay.querySelector(`[data-id="${box.id}"] .tb-content`);
    if (!target) return;
    target.focus();
    const range = document.createRange();
    range.selectNodeContents(target);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
  });
}

function makeDraggable(el, handle, box) {
  let startX = 0, startY = 0, origX = 0, origY = 0, dragging = false;
  const onDown = e => {
    e.preventDefault();
    dragging = true;
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    origX = box.x; origY = box.y;
    el.classList.add('dragging');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
  };
  const onMove = e => {
    if (!dragging) return;
    e.preventDefault();
    const pt = e.touches ? e.touches[0] : e;
    const s = state.scale;
    const maxX = (overlay.clientWidth - 30) / s;
    const maxY = (overlay.clientHeight - 20) / s;
    box.x = Math.max(0, Math.min(maxX, origX + (pt.clientX - startX) / s));
    box.y = Math.max(0, Math.min(maxY, origY + (pt.clientY - startY) / s));
    el.style.left = (box.x * s) + 'px';
    el.style.top = (box.y * s) + 'px';
  };
  const onUp = () => {
    dragging = false;
    el.classList.remove('dragging');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  };
  handle.addEventListener('mousedown', onDown);
  handle.addEventListener('touchstart', onDown, { passive: false });
}

// ============ Export ============
function hasAnnotations() {
  return Object.values(state.pages).some(p => p.textBoxes?.some(b => b.text.trim()));
}

function wrapLine(ctx, text, maxWidth) {
  if (!text) return [''];
  const words = text.split(/\s+/);
  const lines = [];
  let cur = '';
  for (const word of words) {
    const test = cur ? cur + ' ' + word : word;
    if (cur && ctx.measureText(test).width > maxWidth) {
      lines.push(cur);
      cur = word;
    } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}

function drawBoxOnCanvas(ctx, box, scale) {
  if (!box.text.trim()) return;
  const fontSize = box.fontSize * scale;
  const lineHeight = fontSize * 1.35;
  ctx.font = `${fontSize}px Amiri, 'Noto Naskh Arabic', 'Segoe UI', Tahoma, serif`;
  ctx.fillStyle = box.color;
  ctx.textBaseline = 'top';
  ctx.textAlign = 'right';
  try { ctx.direction = 'rtl'; } catch {}

  const rightEdge = (box.x + box.w) * scale;
  const maxWidth = box.w * scale;
  let y = box.y * scale + fontSize * 0.05;

  for (const userLine of box.text.split('\n')) {
    for (const line of wrapLine(ctx, userLine, maxWidth)) {
      ctx.fillText(line, rightEdge, y);
      y += lineHeight;
    }
  }
}

async function exportPDF() {
  if (!state.pdfDoc) return;

  // لا تعليقات → احفظ الأصلي كما هو
  if (!hasAnnotations()) {
    download(new Blob([state.originalBytes], { type: 'application/pdf' }),
             state.fileName || 'document.pdf');
    return toast('تم تنزيل الملف الأصلي', 'success');
  }

  exportBtn.disabled = true;
  const oldLabel = exportBtn.textContent;
  exportBtn.textContent = 'جارٍ التصدير...';

  try {
    const { PDFDocument } = await import('https://esm.sh/pdf-lib@1.17.1');
    const pdfDoc = await PDFDocument.create();

    await document.fonts.ready.catch(() => {});
    try { await document.fonts.load('16px Amiri'); } catch {}

    const renderScale = 2;

    for (let p = 1; p <= state.numPages; p++) {
      const page = await state.pdfDoc.getPage(p);
      const baseVp = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: renderScale });

      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(vp.width);
      canvas.height = Math.ceil(vp.height);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;

      for (const box of getBoxes(p)) drawBoxOnCanvas(ctx, box, renderScale);

      const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
      const bytes = new Uint8Array(await blob.arrayBuffer());
      const img = await pdfDoc.embedPng(bytes);
      const outPage = pdfDoc.addPage([baseVp.width, baseVp.height]);
      outPage.drawImage(img, { x: 0, y: 0, width: baseVp.width, height: baseVp.height });
    }

    const out = await pdfDoc.save();
    const name = (state.fileName || 'document').replace(/\.pdf$/i, '') + '-edited.pdf';
    download(new Blob([out], { type: 'application/pdf' }), name);
    toast('تم التصدير بنجاح', 'success');
  } catch (err) {
    console.error(err);
    toast('فشل التصدير: ' + (err.message || 'خطأ غير معروف'), 'error');
  } finally {
    exportBtn.disabled = false;
    exportBtn.textContent = oldLabel;
  }
}

// ============ Toolbar Actions ============
prevPageBtn.addEventListener('click', async () => {
  if (state.currentPage > 1) { state.currentPage--; await renderCurrentPage(); }
});
nextPageBtn.addEventListener('click', async () => {
  if (state.currentPage < state.numPages) { state.currentPage++; await renderCurrentPage(); }
});
zoomInBtn.addEventListener('click', async () => {
  state.scale = Math.min(3, state.scale * 1.25);
  await renderCurrentPage();
});
zoomOutBtn.addEventListener('click', async () => {
  state.scale = Math.max(0.3, state.scale / 1.25);
  await renderCurrentPage();
});
fitWidthBtn.addEventListener('click', fitWidth);
addTextBtn.addEventListener('click', addTextBox);
exportBtn.addEventListener('click', exportPDF);
resetBtn.addEventListener('click', () => {
  if (!confirm('إغلاق الملف الحالي؟ ستفقد التعديلات غير المصدَّرة.')) return;
  state.pdfDoc = null; state.pages = {}; state.originalBytes = null;
  overlay.innerHTML = '';
  workspace.hidden = true; dropZone.hidden = false;
  fileInput.value = '';
});

// ============ File Input & Drag/Drop ============
browseBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const f = e.target.files?.[0];
  if (f) loadPDF(f);
});
dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const f = e.dataTransfer.files?.[0];
  if (f) loadPDF(f);
});
// السماح بالسحب والإفلات في أي مكان بالصفحة
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  if (state.pdfDoc) return; // منع الاستبدال العرضي
  const f = e.dataTransfer.files?.[0];
  if (f) loadPDF(f);
});

// ============ Deselect on empty overlay click ============
overlay.addEventListener('click', e => {
  if (e.target === overlay) document.activeElement?.blur();
});
pageContainer.addEventListener('click', e => {
  if (!e.target.closest('.text-box')) document.activeElement?.blur();
});

// ============ Keyboard shortcuts ============
document.addEventListener('keydown', e => {
  const editing = document.activeElement?.isContentEditable;
  if (editing) {
    if (e.key === 'Escape') document.activeElement.blur();
    return;
  }
  if (!state.pdfDoc) return;
  if (e.key === 'ArrowLeft' && state.currentPage < state.numPages) {
    state.currentPage++; renderCurrentPage();
  } else if (e.key === 'ArrowRight' && state.currentPage > 1) {
    state.currentPage--; renderCurrentPage();
  }
});

// ============ Resize handling ============
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (state.pdfDoc) renderCurrentPage();
  }, 250);
});

// ============ Old SW cleanup ============
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(regs => regs.forEach(r => r.unregister()))
    .catch(() => {});
}
</script>
</body>
</html>
