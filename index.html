<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>محرر PDF السريع - تعديل ملفاتك بأمان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #e0e7ff;
  --bg: #f8fafc;
  --surface: #ffffff;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --success: #10b981;
  --danger: #ef4444;
  --radius: 16px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
  --shadow-lg: 0 20px 40px -10px rgba(0,0,0,0.08);
}

[data-theme="dark"] {
  --primary: #6366f1;
  --primary-hover: #818cf8;
  --primary-light: #1e1b4b;
  --bg: #0f172a;
  --surface: #1e293b;
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --border: #334155;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; transition: background 0.3s, color 0.3s; overflow-x: hidden; }

/* --- Header --- */
.header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 50; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon { width: 40px; height: 40px; background: var(--primary-light); color: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.brand h1 { font-size: 20px; font-weight: 700; }
.brand span { font-size: 12px; color: var(--text-muted); display: block; font-weight: 500; }
.btn-icon { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
.btn-icon:hover { background: var(--bg); border-color: var(--primary); color: var(--primary); }

/* --- Main Layout --- */
.main { flex: 1; display: flex; flex-direction: column; position: relative; }
.bg-pattern { position: absolute; inset: 0; background-image: radial-gradient(var(--border) 1px, transparent 1px); background-size: 24px 24px; opacity: 0.4; z-index: -1; pointer-events: none; }

/* --- Hero & Drop Zone --- */
.hero { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.drop-card { background: var(--surface); width: 100%; max-width: 680px; border-radius: var(--radius); box-shadow: var(--shadow-lg); border: 1px solid var(--border); padding: 40px; text-align: center; position: relative; overflow: hidden; }
.drop-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--primary), #8b5cf6, #ec4899); }

.drop-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 50px 20px; transition: all 0.3s ease; cursor: pointer; background: var(--bg); position: relative; }
.drop-area:hover, .drop-area.dragover { border-color: var(--primary); background: var(--primary-light); }
.drop-area.dragover { transform: scale(1.02); }

.upload-icon { width: 80px; height: 80px; background: var(--surface); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; box-shadow: var(--shadow-sm); color: var(--primary); transition: transform 0.3s; }
.drop-area:hover .upload-icon { transform: translateY(-5px); }

.drop-card h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
.drop-card p { color: var(--text-muted); font-size: 15px; margin-bottom: 24px; }

.btn-primary { background: var(--primary); color: white; border: none; padding: 14px 32px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
.btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4); }

/* --- Features (Trust Badges) --- */
.features { display: flex; justify-content: center; gap: 24px; margin-top: 30px; flex-wrap: wrap; }
.feature-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); font-weight: 600; }
.feature-item svg { color: var(--success); }

/* --- Workspace (Editor) --- */
.workspace { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; box-shadow: var(--shadow-sm); z-index: 10; }
.tool-group { display: flex; align-items: center; gap: 8px; background: var(--bg); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
.tool-btn { background: transparent; border: none; color: var(--text); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
.tool-btn:hover:not(:disabled) { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }
.tool-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.page-info { font-size: 13px; font-weight: 600; min-width: 60px; text-align: center; color: var(--text-muted); }
.btn-action { padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
.btn-action.success { background: var(--success); color: white; }
.btn-action.success:hover { filter: brightness(0.9); }

.viewer { flex: 1; overflow: auto; padding: 40px; display: flex; justify-content: center; align-items: flex-start; }
.page-container { position: relative; display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border-radius: 4px; background: white; }
#pdfCanvas { display: block; border-radius: 4px; }
.overlay { position: absolute; inset: 0; }

/* Text Boxes */
.text-box { position: absolute; border: 1.5px dashed transparent; padding: 4px 8px; cursor: text; transition: 0.15s; }
.text-box:hover { border-color: var(--primary); background: rgba(255,255,255,0.8); }
.text-box:focus-within { border-color: var(--primary); background: rgba(255,255,255,0.95); box-shadow: 0 0 0 3px var(--primary-light); }
.tb-content { outline: none; min-height: 1.2em; white-space: pre-wrap; line-height: 1.4; }
.tb-handle { position: absolute; top: -10px; right: -10px; width: 20px; height: 20px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: grab; opacity: 0; }
.tb-delete { position: absolute; top: -10px; left: -10px; width: 20px; height: 20px; background: var(--danger); color: white; border: none; border-radius: 50%; font-size: 10px; cursor: pointer; opacity: 0; display: flex; align-items: center; justify-content: center; }
.text-box:hover .tb-handle, .text-box:focus-within .tb-handle, .text-box:hover .tb-delete, .text-box:focus-within .tb-delete { opacity: 1; }

/* Toasts */
.toast-container { position: fixed; bottom: 24px; left: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
.toast { background: var(--surface); color: var(--text); padding: 14px 20px; border-radius: 12px; box-shadow: var(--shadow-lg); border-right: 4px solid var(--primary); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
.toast.success { border-right-color: var(--success); }
.toast.error { border-right-color: var(--danger); }
@keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

@media (max-width: 640px) {
  .toolbar { flex-direction: column; align-items: stretch; }
  .tool-group { justify-content: center; }
  .viewer { padding: 16px; }
  .drop-card { padding: 24px; }
  .features { gap: 12px; flex-direction: column; align-items: center; }
}
</style>
</head>
<body>
<div class="header">
  <div class="brand">
    <div class="brand-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
    </div>
    <div>
      <h1>محرر PDF السريع</h1>
      <span>تعديل آمن داخل المتصفح</span>
    </div>
  </div>
  <button id="themeToggle" class="btn-icon" title="تبديل المظهر">
    <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>
</div>

<div class="main">
  <div class="bg-pattern"></div>

  <!-- Landing / Drop Zone -->
  <section id="dropZone" class="hero">
    <div class="drop-card">
      <div class="drop-area" id="dropArea">
        <div class="upload-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        </div>
        <h2>اختر ملف PDF أو اسحبه هنا</h2>
        <p>يعمل بالكامل داخل متصفحك بأمان وسرعة عالية، دون رفع الملفات لأي خادم.</p>
        <button class="btn-primary" id="browseBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          تصفح ملفات الجهاز
        </button>
        <input type="file" id="fileInput" accept="application/pdf" hidden>
      </div>
      
      <div class="features">
        <div class="feature-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          100% آمن وخاص
        </div>
        <div class="feature-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          سريع وبدون انتظار
        </div>
        <div class="feature-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
          دعم كامل للغة العربية
        </div>
      </div>
    </div>
  </section>

  <!-- Workspace (Hidden initially) -->
  <section id="workspace" class="workspace" hidden>
    <div class="toolbar">
      <div class="tool-group">
        <button id="prevPage" class="tool-btn" title="السابق">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span id="pageInfo" class="page-info">1 / 1</span>
        <button id="nextPage" class="tool-btn" title="التالي">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>

      <div class="tool-group">
        <button id="zoomOut" class="tool-btn" title="تصغير">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <span id="zoomInfo" class="page-info">100%</span>
        <button id="zoomIn" class="tool-btn" title="تكبير">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>

      <div class="tool-group" style="border:none; background:transparent; padding:0;">
        <button id="addText" class="btn-primary" style="padding: 8px 16px; font-size: 14px; box-shadow: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
          إضافة نص
        </button>
        <button id="exportBtn" class="btn-action success">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          تصدير
        </button>
        <button id="resetBtn" class="tool-btn" title="إغلاق الملف" style="color: var(--danger);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </div>

    <div class="viewer" id="viewer">
      <div class="page-container" id="pageContainer">
        <canvas id="pdfCanvas"></canvas>
        <div class="overlay" id="overlay"></div>
      </div>
    </div>
  </section>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.8.69/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.8.69/build/pdf.worker.min.mjs';

const state = { pdfDoc: null, numPages: 0, currentPage: 1, scale: 1, pages: {}, fileName: '', originalBytes: null };
const $ = id => document.getElementById(id);
const dropZone = $('dropZone'), workspace = $('workspace'), fileInput = $('fileInput');
const browseBtn = $('browseBtn'), dropArea = $('dropArea'), viewer = $('viewer'), pdfCanvas = $('pdfCanvas');
const overlay = $('overlay'), pageContainer = $('pageContainer');
const pageInfo = $('pageInfo'), zoomInfo = $('zoomInfo');
const prevPageBtn = $('prevPage'), nextPageBtn = $('nextPage');
const zoomInBtn = $('zoomIn'), zoomOutBtn = $('zoomOut');
const addTextBtn = $('addText'), exportBtn = $('exportBtn'), resetBtn = $('resetBtn');
const themeToggle = $('themeToggle'), themeIcon = $('themeIcon'), toastContainer = $('toastContainer');

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${type === 'success' ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>' : type === 'error' ? '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>' : '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>'}</svg><span>${msg}</span>`;
  toastContainer.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(-20px)'; el.style.transition = 'all 0.3s'; }, 3500);
  setTimeout(() => el.remove(), 3800);
}
function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// Theme
const savedTheme = localStorage.getItem('theme') || 'light';
document.documentElement.dataset.theme = savedTheme;
updateThemeIcon(savedTheme);
themeToggle.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('theme', next);
  updateThemeIcon(next);
});
function updateThemeIcon(theme) {
  themeIcon.innerHTML = theme === 'dark' ? '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>' : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
}

// Load PDF
async function loadPDF(file) {
  if (!file || (!file.type.includes('pdf') && !file.name.toLowerCase().endsWith('.pdf'))) return toast('يرجى اختيار ملف PDF صالح', 'error');
  if (file.size > 50 * 1024 * 1024) return toast('الحجم يتجاوز 50 ميجابايت', 'error');
  try {
    const buf = await file.arrayBuffer();
    state.originalBytes = new Uint8Array(buf.slice(0));
    state.pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
    state.numPages = state.pdfDoc.numPages;
    state.currentPage = 1; state.pages = {}; state.fileName = file.name;
    dropZone.hidden = true; workspace.hidden = false;
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const page = await state.pdfDoc.getPage(1);
    const vp = page.getViewport({ scale: 1 });
    state.scale = Math.min(3, Math.max(0.3, (viewer.clientWidth - 80) / vp.width));
    await renderCurrentPage();
    toast('تم فتح الملف بنجاح', 'success');
  } catch (err) {
    console.error(err); toast('فشل فتح الملف', 'error');
  }
}

// Render
async function renderCurrentPage() {
  if (!state.pdfDoc) return;
  const page = await state.pdfDoc.getPage(state.currentPage);
  const viewport = page.getViewport({ scale: state.scale });
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  pdfCanvas.width = Math.floor(viewport.width * dpr); pdfCanvas.height = Math.floor(viewport.height * dpr);
  pdfCanvas.style.width = viewport.width + 'px'; pdfCanvas.style.height = viewport.height + 'px';
  const ctx = pdfCanvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  await page.render({ canvasContext: ctx, viewport }).promise;
  overlay.style.width = viewport.width + 'px'; overlay.style.height = viewport.height + 'px';
  pageInfo.textContent = `${state.currentPage} / ${state.numPages}`;
  zoomInfo.textContent = Math.round(state.scale * 100) + '%';
  prevPageBtn.disabled = state.currentPage <= 1; nextPageBtn.disabled = state.currentPage >= state.numPages;
  renderTextBoxes();
}

function getBoxes(p) { return (state.pages[p] ||= { textBoxes: [] }).textBoxes; }
function currentBoxes() { return getBoxes(state.currentPage); }

function renderTextBoxes() {
  overlay.innerHTML = '';
  for (const box of currentBoxes()) overlay.appendChild(buildBoxEl(box));
}

function buildBoxEl(box) {
  const s = state.scale;
  const el = document.createElement('div');
  el.className = 'text-box'; el.dataset.id = box.id;
  Object.assign(el.style, { left: (box.x * s) + 'px', top: (box.y * s) + 'px', width: (box.w * s) + 'px', minHeight: (box.h * s) + 'px', fontSize: (box.fontSize * s) + 'px', color: box.color });
  const handle = document.createElement('div'); handle.className = 'tb-handle'; handle.innerHTML = '⠿';
  const del = document.createElement('button'); del.className = 'tb-delete'; del.innerHTML = '✕';
  const content = document.createElement('div'); content.className = 'tb-content'; content.contentEditable = 'true'; content.spellcheck = false; content.dir = 'auto'; content.textContent = box.text;
  content.addEventListener('input', () => { box.text = content.innerText; const baseH = content.scrollHeight / s; box.h = Math.max(box.fontSize * 1.4, baseH); el.style.minHeight = (box.h * s) + 'px'; });
  content.addEventListener('blur', () => {
    if (!content.innerText.trim()) { const idx = currentBoxes().findIndex(b => b.id === box.id); if (idx > -1) currentBoxes().splice(idx, 1); el.remove(); }
  });
  del.addEventListener('click', e => { e.stopPropagation(); const idx = currentBoxes().findIndex(b => b.id === box.id); if (idx > -1) currentBoxes().splice(idx, 1); el.remove(); });
  el.append(handle, content, del); makeDraggable(el, handle, box); return el;
}

function addTextBox() {
  if (!state.pdfDoc) return;
  const s = state.scale, w = 220, h = 40, fontSize = 16;
  const cx = (overlay.clientWidth / 2) / s, cy = (overlay.clientHeight / 2) / s;
  const box = { id: 'tb_' + Date.now().toString(36), x: cx - w / 2, y: cy - h / 2, w, h, text: 'اكتب هنا...', fontSize, color: '#0f172a' };
  currentBoxes().push(box); renderTextBoxes();
  requestAnimationFrame(() => {
    const target = overlay.querySelector(`[data-id="${box.id}"] .tb-content`);
    if (!target) return;
    target.focus(); const range = document.createRange(); range.selectNodeContents(target);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  });
}

function makeDraggable(el, handle, box) {
  let startX = 0, startY = 0, origX = 0, origY = 0, dragging = false;
  const onDown = e => {
    e.preventDefault(); dragging = true; const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY; origX = box.x; origY = box.y;
    document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive: false }); document.addEventListener('touchend', onUp);
  };
  const onMove = e => {
    if (!dragging) return; e.preventDefault(); const pt = e.touches ? e.touches[0] : e;
    const s = state.scale, maxX = (overlay.clientWidth - 30) / s, maxY = (overlay.clientHeight - 20) / s;
    box.x = Math.max(0, Math.min(maxX, origX + (pt.clientX - startX) / s));
    box.y = Math.max(0, Math.min(maxY, origY + (pt.clientY - startY) / s));
    el.style.left = (box.x * s) + 'px'; el.style.top = (box.y * s) + 'px';
  };
  const onUp = () => {
    dragging = false; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onUp);
  };
  handle.addEventListener('mousedown', onDown); handle.addEventListener('touchstart', onDown, { passive: false });
}

// Export
function wrapLine(ctx, text, maxWidth) {
  if (!text) return ['']; const words = text.split(/\s+/); const lines = []; let cur = '';
  for (const word of words) {
    const test = cur ? cur + ' ' + word : word;
    if (cur && ctx.measureText(test).width > maxWidth) { lines.push(cur); cur = word; } else cur = test;
  }
  if (cur) lines.push(cur); return lines.length ? lines : [''];
}
function drawBoxOnCanvas(ctx, box, scale) {
  if (!box.text.trim()) return;
  const fontSize = box.fontSize * scale, lineHeight = fontSize * 1.35;
  ctx.font = `${fontSize}px Cairo, 'Segoe UI', Tahoma, serif`; ctx.fillStyle = box.color; ctx.textBaseline = 'top'; ctx.textAlign = 'right';
  try { ctx.direction = 'rtl'; } catch {}
  const rightEdge = (box.x + box.w) * scale, maxWidth = box.w * scale;
  let y = box.y * scale + fontSize * 0.05;
  for (const userLine of box.text.split('\n')) {
    for (const line of wrapLine(ctx, userLine, maxWidth)) { ctx.fillText(line, rightEdge, y); y += lineHeight; }
  }
}

async function exportPDF() {
  if (!state.pdfDoc) return;
  exportBtn.disabled = true; const oldHTML = exportBtn.innerHTML; exportBtn.innerHTML = 'جاري التصدير...';
  try {
    const { PDFDocument } = await import('https://esm.sh/pdf-lib@1.17.1');
    const pdfDoc = await PDFDocument.create();
    await document.fonts.ready.catch(() => {}); await document.fonts.load('16px Cairo').catch(() => {});
    const renderScale = 2;
    for (let p = 1; p <= state.numPages; p++) {
      const page = await state.pdfDoc.getPage(p);
      const baseVp = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: renderScale });
      const canvas = document.createElement('canvas'); canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
      const ctx = canvas.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      for (const box of getBoxes(p)) drawBoxOnCanvas(ctx, box, renderScale);
      const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
      const img = await pdfDoc.embedPng(new Uint8Array(await blob.arrayBuffer()));
      const outPage = pdfDoc.addPage([baseVp.width, baseVp.height]); outPage.drawImage(img, { x: 0, y: 0, width: baseVp.width, height: baseVp.height });
    }
    const out = await pdfDoc.save();
    download(new Blob([out], { type: 'application/pdf' }), (state.fileName || 'document').replace(/\.pdf$/i, '') + '-edited.pdf');
    toast('تم التصدير بنجاح', 'success');
  } catch (err) {
    console.error(err); toast('فشل التصدير', 'error');
  } finally { exportBtn.disabled = false; exportBtn.innerHTML = oldHTML; }
}

// Events
prevPageBtn.onclick = () => { if (state.currentPage > 1) { state.currentPage--; renderCurrentPage(); } };
nextPageBtn.onclick = () => { if (state.currentPage < state.numPages) { state.currentPage++; renderCurrentPage(); } };
zoomInBtn.onclick = () => { state.scale = Math.min(3, state.scale * 1.25); renderCurrentPage(); };
zoomOutBtn.onclick = () => { state.scale = Math.max(0.3, state.scale / 1.25); renderCurrentPage(); };
addTextBtn.onclick = addTextBox;
exportBtn.onclick = exportPDF;
resetBtn.onclick = () => {
  if (!confirm('إغلاق الملف الحالي؟')) return;
  state.pdfDoc = null; state.pages = {}; state.originalBytes = null; overlay.innerHTML = '';
  workspace.hidden = true; dropZone.hidden = false; fileInput.value = '';
};

browseBtn.onclick = () => fileInput.click();
fileInput.onchange = e => { if (e.target.files?.[0]) loadPDF(e.target.files[0]); };
dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('dragover'); });
dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
dropArea.addEventListener('drop', e => { e.preventDefault(); dropArea.classList.remove('dragover'); if (e.dataTransfer.files?.[0]) loadPDF(e.dataTransfer.files[0]); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); if (!state.pdfDoc && e.dataTransfer.files?.[0]) loadPDF(e.dataTransfer.files[0]); });

document.addEventListener('keydown', e => {
  if (document.activeElement?.isContentEditable) { if (e.key === 'Escape') document.activeElement.blur(); return; }
  if (!state.pdfDoc) return;
  if (e.key === 'ArrowLeft' && state.currentPage < state.numPages) { state.currentPage++; renderCurrentPage(); }
  else if (e.key === 'ArrowRight' && state.currentPage > 1) { state.currentPage--; renderCurrentPage(); }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(() => {});
</script>
